spring:
  application:
    name: doogoo
  profiles:
    default: dev

cors:
  allowed-origins: "*"

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health

crawl:
  dodream:
    base-url: https://do.sejong.ac.kr
    list-path: /ko/program/all/list/0/{page}
    detail-path: /ko/program/all/view/{id}
    delay-ms: 1500
    regular-pages: 2
    active-statuses:
      - scheduled
      - open
      - operation

openai:
  api-key: ${OPENAI_API_KEY:dummy-key}
  model: gpt-4o-mini
  url: https://api.openai.com/v1/chat/completions
