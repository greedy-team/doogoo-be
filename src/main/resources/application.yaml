spring:
  application:
    name: doogoo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doogoo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

crawl:
  dodream:
    base-url: https://do.sejong.ac.kr
    list-path: /ko/program/all/list/all/{page}
    detail-path: /ko/program/all/view/{id}
    delay-ms: 1500
    regular-pages: 2

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  url: https://api.openai.com/v1/chat/completions
