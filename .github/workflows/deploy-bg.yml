name: Deploy Oracle Single Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.NGINX_HOST }}
      SSH_PORT: ${{ secrets.NGINX_PORT }}
      APP_PORT: ${{ secrets.APP_GREEN_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Build app
        run: ./gradlew bootJar -x test

      - name: Select executable jar
        shell: bash
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "Executable jar not found"
            exit 1
          fi

          mkdir -p jar-out
          cp "$JAR_PATH" jar-out/app.jar

      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload jar
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" \
            jar-out/app.jar \
            "$SSH_USER@$SSH_HOST:/tmp/doogoo-app.jar"

      - name: Upload scripts
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" \
            scripts/deploy-app.sh scripts/restart-app.sh \
            scripts/start-blue.sh scripts/start-green.sh \
            scripts/stop-blue.sh scripts/stop-green.sh \
            scripts/switch-nginx.sh \
            "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Restart app on server
        shell: bash
        run: |
          APP_PORT_VALUE="${APP_PORT:-50010}"

          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu

            sudo -n mkdir -p /opt/doogoo/bin /opt/doogoo/green /etc/doogoo
            sudo -n cp /tmp/deploy-app.sh /tmp/restart-app.sh /tmp/start-blue.sh /tmp/start-green.sh /tmp/stop-blue.sh /tmp/stop-green.sh /tmp/switch-nginx.sh /opt/doogoo/bin/
            sudo -n sed -i 's/\\r\$//' /opt/doogoo/bin/*.sh
            sudo -n chmod +x /opt/doogoo/bin/*.sh

            cp /tmp/doogoo-app.jar /opt/doogoo/green/app.jar

            DOOGOO_GREEN_PORT=${APP_PORT_VALUE} /opt/doogoo/bin/stop-green.sh || true
            DOOGOO_GREEN_PORT=${APP_PORT_VALUE} DOOGOO_ENV_FILE=/opt/doogoo/shared/.env /opt/doogoo/bin/start-green.sh

            echo 'proxy_pass http://127.0.0.1:${APP_PORT_VALUE};' | sudo -n tee /etc/nginx/doogoo-proxy-active.conf >/dev/null
            echo green | sudo -n tee /etc/doogoo/active >/dev/null
            sudo -n nginx -t
            sudo -n systemctl reload nginx
          "

      - name: Check app health
        shell: bash
        run: |
          APP_PORT_VALUE="${APP_PORT:-50010}"

          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -eu

            OK=0
            for i in \$(seq 1 45); do
              if /usr/bin/curl -fsS http://127.0.0.1:${APP_PORT_VALUE}/actuator/health; then
                OK=1
                break
              fi
              echo \"health retry: \$i\"
              sleep 2
            done

            if [ \"\$OK\" -ne 1 ]; then
              echo 'App health check failed'
              exit 1
            fi
          "

      - name: Check public health
        shell: bash
        run: |
          OK=0
          for i in $(seq 1 20); do
            if curl -k -fsS https://sejongdoogoo-api.com/actuator/health; then
              OK=1
              break
            fi
            echo "public health retry: $i"
            sleep 2
          done

          if [ "$OK" -ne 1 ]; then
            echo "Public health check failed"
            exit 1
          fi
