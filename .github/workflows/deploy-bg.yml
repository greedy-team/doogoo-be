name: Deploy Oracle Single Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.NGINX_HOST }}
      SSH_PORT: ${{ secrets.NGINX_PORT }}
      APP_PORT: ${{ secrets.APP_GREEN_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Build
        run: ./gradlew bootJar -x test

      - name: Select executable jar
        shell: bash
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "Executable jar not found"
            exit 1
          fi

          mkdir -p jar-out
          cp "$JAR_PATH" jar-out/app.jar

      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload jar
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" \
            jar-out/app.jar \
            "$SSH_USER@$SSH_HOST:/opt/doogoo/green/app.jar"

      - name: Restart app on server
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -eu
            sudo mkdir -p /opt/doogoo/green
            [ -x /opt/doogoo/bin/stop-green.sh ] && /opt/doogoo/bin/stop-green.sh || true
            [ -x /opt/doogoo/bin/start-green.sh ] && /opt/doogoo/bin/start-green.sh
            echo "proxy_pass http://127.0.0.1:'"$APP_PORT"';" | sudo tee /etc/nginx/doogoo-proxy-active.conf >/dev/null
            echo green | sudo tee /etc/doogoo/active >/dev/null
            sudo nginx -t
            sudo systemctl reload nginx
          '

      - name: Health check on app port
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -eu

            OK=0
            for i in $(seq 1 45); do
              if /usr/bin/curl -fsS "http://127.0.0.1:'"$APP_PORT"'/actuator/health"; then
                OK=1
                break
              fi
              echo "health retry: $i"
              sleep 2
            done

            if [ "$OK" -ne 1 ]; then
              echo "App health check failed"
              exit 1
            fi
          '

      - name: Public health check
        shell: bash
        run: |
          OK=0
          for i in $(seq 1 20); do
            if curl -k -fsS https://sejongdoogoo-api.com/actuator/health; then
              OK=1
              break
            fi
            echo "public health retry: $i"
            sleep 2
          done

          if [ "$OK" -ne 1 ]; then
            echo "Public health check failed"
            exit 1
          fi
