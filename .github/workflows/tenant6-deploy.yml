name: Deploy to Tenant Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Copy jar to Tenant Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENANT_HOST }}
          username: ${{ secrets.TENANT_USER }}
          password: ${{ secrets.TENANT_PW }}
          port: ${{ secrets.TENANT_SSH_PORT }}
          source: "build/libs/*.jar"
          target: "/home/tenant-user/app"
          strip_components: 2

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENANT_HOST }}
          username: ${{ secrets.TENANT_USER }}
          password: ${{ secrets.TENANT_PW }}
          port: ${{ secrets.TENANT_SSH_PORT }}
          script: |
            fuser -k 8080/tcp || true
            
            mkdir -p /home/${{ secrets.TENANT_USER }}/logs/doogoo
            
            nohup java -Xmx512m -jar /home/${{ secrets.TENANT_USER }}/app/*.jar > /home/${{ secrets.TENANT_USER }}/logs/doogoo/console.log 2>&1 &
            
            sleep 5
            ps aux | grep java | grep -v grep || true
